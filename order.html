<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your BitchBoy order · BLOCK SYSTEM Hardware</title>
<style>
  /* Direct sales (ops.sale_request): one buyer's one-time link. Same look as the pickup page (index.html).
     open → the form · submitted → "we're checking" · approved → the order + Pay (Stripe Checkout) · paid → thanks */
  :root { --bg: #f4f4f1; --card: #ffffff; --ink: #15181c; --ink-2: #5d6470; --rule: #d9dbd6; --accent: #c64e0c; --ok: #1c6244; --bad: #9e211b; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121419; --card: #1b1e24; --ink: #e8ebef; --ink-2: #9aa2ae; --rule: #2e333b; --accent: #ff8542; --ok: #4fbf8b; --bad: #e97a70; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 16px 32px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  main > *, .card > *, form > * { min-width: 0; }
  #view { display: grid; gap: 14px; }
  .brand { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  h1 { font-size: 26px; line-height: 1.15; margin: 4px 0 0; }
  h2 { font-size: 17px; margin: 0; }
  .card { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
  label { font-weight: 600; display: grid; gap: 6px; font-size: 15px; }
  .opt { font-weight: 400; color: var(--ink-2); font-size: 13px; }
  input[type=text], input[type=email], input[type=tel], select, textarea { font: inherit; padding: 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); color: var(--ink); width: 100%; }
  textarea { min-height: 70px; resize: vertical; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
  .choice { position: relative; }
  .choice input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .choice { min-width: 0; }
  .choice > span { display: flex; align-items: center; gap: 8px; padding: 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); font-weight: 600; height: 100%; }
  .choice input:checked + span { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .choice input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sw { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--rule); flex: none; }
  .sub { display: block; font-weight: 400; color: var(--ink-2); font-size: 13px; }
  button { font: inherit; font-weight: 600; border-radius: 8px; padding: 14px 18px; border: 1px solid var(--ink); background: var(--ink); color: var(--card); cursor: pointer; width: 100%; }
  button.pay { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.link { width: auto; padding: 6px 10px; background: none; color: var(--ink-2); border-color: var(--rule); font-weight: 500; font-size: 14px; }
  button:disabled { opacity: .5; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td { padding: 6px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
  td.n { text-align: right; white-space: nowrap; padding-left: 10px; }
  tr.total td { font-weight: 700; border-bottom: 0; padding-top: 10px; }
  .msg { padding: 16px; border-radius: 10px; border: 1px solid var(--rule); background: var(--card); }
  .msg.ok { border-color: var(--ok); } .msg.bad { border-color: var(--bad); }
  .msg h2 { margin: 0 0 6px; font-size: 20px; }
  .err { color: var(--bad); font-size: 14px; min-height: 1em; margin: 0; }
  .small { font-size: 13px; color: var(--ink-2); margin: 0; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div>
    <div class="brand">BLOCK SYSTEM Hardware · bitchboy</div>
    <h1 id="title">Your BitchBoy order</h1>
  </div>
  <div id="view"><p class="small">Loading…</p></div>
  <p class="small">BLOCK SYSTEM Hardware V.O.F. · Amsterdam · KvK 99889919 · bitchboy.lol</p>
</main>
<script>
const API = "https://iahztsmeyqcswoagpmme.supabase.co/functions/v1/sale-request";
const params = new URLSearchParams(location.search);
const token = params.get("t") || "";
const view = document.getElementById("view");
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eur = (c) => "€" + (Number(c || 0) / 100).toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const regionName = new Intl.DisplayNames(["en"], { type: "region" });
const COUNTRIES = ("AD AE AF AG AI AL AM AO AR AT AU AW AX AZ BA BB BD BE BF BG BH BI BJ BM BN BO BR BS BT BW BY BZ CA CD CF CG CH CI CL CM CN CO CR CV CW CY CZ DE DJ DK DM DO DZ EC EE EG ES ET FI FJ FO FR GA GB GD GE GF GG GH GI GL GM GN GP GQ GR GT GU GW GY HK HN HR HT HU ID IE IL IM IN IQ IS IT JE JM JO JP KE KG KH KM KN KR KW KY KZ LA LB LC LI LK LR LS LT LU LV MA MC MD ME MG MK ML MN MO MQ MR MT MU MV MW MX MY MZ NA NC NE NG NI NL NO NP NZ OM PA PE PF PG PH PK PL PR PS PT PY QA RE RO RS RW SA SC SE SG SI SK SL SM SN SR SV SX SZ TC TD TG TH TJ TL TN TO TR TT TW TZ UA UG US UY UZ VC VE VG VI VN WS XK ZA ZM ZW")
  .split(" ").map((c) => [c, c === "XK" ? "Kosovo" : regionName.of(c)]).sort((a, b) => a[1].localeCompare(b[1]));

const message = (cls, title, text) => { view.innerHTML = `<div class="msg ${cls}"><h2>${title}</h2><p class="small">${text}</p></div>`; };
const DEAD = {
  invalid: ["This link doesn't work", "Please ask us on Instagram for a new link."],
  expired: ["This link has expired", "Links work for 7 days. Please ask us on Instagram for a new one."],
};

async function load() {
  try {
    const r = await fetch(`${API}?t=${encodeURIComponent(token)}`);
    show(await r.json());
  } catch { message("bad", "No connection", "Check your internet connection and reload this page."); }
}

function show(d, edit) {
  if (DEAD[d.state]) return message("bad", ...DEAD[d.state]);
  if (d.state === "open" || edit) return form(d.buyer || {}, d.expires_at);
  if (d.state === "submitted") return submitted(d.buyer);
  if (d.state === "declined") return message("bad", "We can't take this order", esc(d.reason || "Sorry: we can't deliver this order. Message us on Instagram for questions."));
  if (d.state === "paid") return message("ok", "Paid, thank you! 🎛️", d.pay_method && d.pay_method !== "stripe"
    ? `We received your payment. Your invoice ${esc(d.invoice_no || "")}: <a href="${invoiceUrl()}" target="_blank" rel="noopener">download (PDF)</a>. We'll message you when your BitchBoy ${d.delivery === "pickup" ? "is ready to pick up" : "ships"}.`
    : "Stripe emails you the receipt and invoice. We'll message you when your BitchBoy ships or is ready to pick up.");
  if (d.state === "approved") return approved(d);
  if (d.error) return message("bad", "Something went wrong", esc(d.error));
  message("bad", ...DEAD.invalid);
}

// ── the form ────────────────────────────────────────────────────────────────
function form(b, expires) {
  const a = b.address || {};
  const radio = (name, value, label, sub, checked, extra = "") =>
    `<label class="choice"><input type="radio" name="${name}" value="${value}" ${checked ? "checked" : ""}><span>${extra}<span>${label}${sub ? `<span class="sub">${sub}</span>` : ""}</span></span></label>`;
  view.innerHTML = `
    <p class="small">Fill this in once. We check it and send you the final price, then you pay with card or iDEAL on Stripe.${expires ? ` This link works until ${new Date(expires).toLocaleDateString("en-GB", { day: "numeric", month: "long" })}.` : ""}</p>
    <form id="f" novalidate>
      <div class="card">
        <h2>What you want</h2>
        <label for="qty">How many BitchBoys
          <select id="qty">${[1, 2, 3, 4, 5].map((n) => `<option ${Number(b.qty || 1) === n ? "selected" : ""}>${n}</option>`).join("")}</select>
        </label>
        <div><div style="font-weight:600;margin-bottom:6px">Cover colour</div>
          <div class="choices">
            ${radio("cover", "orange", "Orange", "", b.cover === "orange", '<span class="sw" style="background:#f26a1b"></span>')}
            ${radio("cover", "white", "White", "", b.cover === "white", '<span class="sw" style="background:#f4f4f1"></span>')}
          </div>
        </div>
      </div>
      <div class="card" style="margin-top:14px">
        <h2>You</h2>
        <label for="name">Full name<input type="text" id="name" autocomplete="name" maxlength="100" value="${esc(b.name)}"></label>
        <label for="email">Email <span class="opt">for the receipt and invoice</span><input type="email" id="email" autocomplete="email" maxlength="200" value="${esc(b.email)}"></label>
        <label for="phone">Phone <span class="opt">with country code, for the courier</span><input type="tel" id="phone" autocomplete="tel" maxlength="30" placeholder="+31 6 1234 5678" value="${esc(b.phone)}"></label>
      </div>
      <div class="card" style="margin-top:14px">
        <h2>Delivery</h2>
        <div class="choices">
          ${radio("delivery", "ship", "Ship to me", "by courier", b.delivery === "ship")}
          ${radio("delivery", "pickup", "Pick up", "in Amsterdam", b.delivery === "pickup")}
        </div>
        <div id="addr" ${b.delivery === "ship" ? "" : "hidden"} style="display:grid;gap:12px">
          <label for="country">Country<select id="country" autocomplete="country"><option value="">Choose…</option>${COUNTRIES.map(([c, n]) => `<option value="${c}" ${a.country === c ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></label>
          <label for="line1">Street and house number<input type="text" id="line1" autocomplete="address-line1" maxlength="120" value="${esc(a.line1)}"></label>
          <label for="line2">Apartment, floor <span class="opt">(optional)</span><input type="text" id="line2" autocomplete="address-line2" maxlength="120" value="${esc(a.line2)}"></label>
          <div class="two">
            <label for="postal">Postcode<input type="text" id="postal" autocomplete="postal-code" maxlength="20" value="${esc(a.postal_code)}"></label>
            <label for="city">City<input type="text" id="city" autocomplete="address-level2" maxlength="80" value="${esc(a.city)}"></label>
          </div>
          <label for="state" id="stateLbl">State / province <span class="opt">(if your country has one)</span><input type="text" id="state" autocomplete="address-level1" maxlength="60" value="${esc(a.state)}"></label>
        </div>
        <p class="small" id="pickupNote" ${b.delivery === "pickup" ? "" : "hidden"}>We agree the time and place in Amsterdam with you on Instagram.</p>
      </div>
      <div class="card" style="margin-top:14px">
        <label for="note">Anything else? <span class="opt">(optional)</span><textarea id="note" maxlength="500">${esc(b.note)}</textarea></label>
        <p class="err" id="err" role="alert"></p>
        <button type="submit" id="go">Send my details</button>
      </div>
    </form>`;
  const f = document.getElementById("f");
  f.querySelectorAll('input[name=delivery]').forEach((r) => r.onchange = () => {
    const ship = f.delivery.value === "ship";
    document.getElementById("addr").hidden = !ship; document.getElementById("pickupNote").hidden = ship;
  });
  f.onsubmit = submit;
}

async function submit(e) {
  e.preventDefault();
  const f = e.target, err = document.getElementById("err"), btn = document.getElementById("go");
  const v = (id) => document.getElementById(id).value;
  const buyer = {
    name: v("name"), email: v("email"), phone: v("phone"), delivery: f.delivery.value, qty: Number(v("qty")), cover: f.cover.value, note: v("note"),
    address: f.delivery.value === "ship" ? { country: v("country"), line1: v("line1"), line2: v("line2"), postal_code: v("postal"), city: v("city"), state: v("state") } : null,
  };
  if (!buyer.cover) { err.textContent = "Please choose a cover colour."; return; }
  if (!buyer.delivery) { err.textContent = "Please choose shipping or pickup in Amsterdam."; return; }
  err.textContent = ""; btn.disabled = true; btn.textContent = "Sending…";
  try {
    const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ t: token, action: "submit", buyer }) });
    const d = await r.json();
    if (d.state) { window.scrollTo(0, 0); return show(d); }
    err.textContent = d.error || "Something went wrong. Please try again.";
  } catch { err.textContent = "No connection. Check your internet and try again."; }
  btn.disabled = false; btn.textContent = "Send my details";
}

// ── after sending ───────────────────────────────────────────────────────────
const coverName = { orange: "orange cover", white: "white cover", none: "no cover" };
function submitted(b) {
  const a = b.address;
  view.innerHTML = `
    <div class="msg ok"><h2>Thanks, ${esc(b.name.split(" ")[0])}!</h2><p class="small">We're checking your order and will message you with the final price. Then you pay on this same page.</p></div>
    <div class="card">
      <h2>What you sent</h2>
      <p class="small" style="color:var(--ink)">${b.qty}× BitchBoy, ${coverName[b.cover]}<br>${esc(b.name)} · ${esc(b.email)} · ${esc(b.phone)}<br>
      ${a ? `Ship to: ${esc([a.line1, a.line2, `${a.postal_code} ${a.city}`.trim(), a.state, regionName.of(a.country)].filter(Boolean).join(", "))}` : "Pick up in Amsterdam"}</p>
      <button type="button" class="link" id="edit">Change my details</button>
    </div>`;
  document.getElementById("edit").onclick = () => show({ state: "open", buyer: b }, true);
}

function approved(d) {
  const rows = d.lines.map((l) => `<tr><td>${l.qty > 1 ? `${l.qty}× ` : ""}${esc(l.description)}</td><td class="n">${l.amount_cents ? eur(l.amount_cents) : "<b>free 🎁</b>"}</td></tr>`).join("");
  view.innerHTML = `
    <div class="card">
      <h2>Your order${d.name ? `, ${esc(d.name.split(" ")[0])}` : ""}</h2>
      <table>${rows}
        <tr><td>${esc(d.shipping_name)}</td><td class="n">${d.shipping_cents ? eur(d.shipping_cents) : "free"}</td></tr>
        <tr class="total"><td>Total</td><td class="n">${eur(d.total_cents)}</td></tr>
      </table>
      <p class="small">${d.inclusive ? "Prices include VAT." : "Prices without VAT (export). Import duties and taxes in your country, if any, are paid on delivery."}
      ${d.delivery === "pickup" ? " Pickup in Amsterdam: we agree the time with you." : ""}</p>
      ${d.pay_method === "bank" ? bankBox(d) : d.pay_method === "cash" ? cashBox(d) : `
      <p class="err" id="err" role="alert"></p>
      <button type="button" class="pay" id="pay">Pay ${eur(d.total_cents)}</button>
      <p class="small">Secure payment on Stripe (card, iDEAL and more). Your details are filled in for you.</p>`}
    </div>`;
  const p = document.getElementById("pay"); if (p) p.onclick = pay;
  view.querySelectorAll("[data-copy]").forEach((b) => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); const t = b.textContent; b.textContent = "Copied ✓"; setTimeout(() => b.textContent = t, 1500); } catch {}
  });
}

// bank transfer / cash (NL buyers and pickups): our own invoice instead of Stripe
const invoiceUrl = () => `${API}?t=${encodeURIComponent(token)}&invoice=1`;
const longDay = (t) => new Date(t).toLocaleDateString("en-GB", { day: "numeric", month: "long" });
function bankBox(d) {
  const row = (k, v, copy) => `<tr><td>${k}</td><td class="n"><b>${esc(v)}</b>${copy ? ` <button type="button" class="link" data-copy="${esc(copy)}">Copy</button>` : ""}</td></tr>`;
  return `
      <h2 style="margin-top:6px">Pay by bank transfer</h2>
      <table>
        ${row("Amount", eur(d.total_cents), (d.total_cents / 100).toFixed(2))}
        ${row("To", d.bank.name)}
        ${row("IBAN", d.bank.iban, d.bank.iban.replace(/\s/g, ""))}
        ${row("BIC", d.bank.bic)}
        ${row("Reference", d.pay_ref, d.pay_ref)}
      </table>
      <p class="small">Please use exactly this reference, so we can match your payment${d.due ? `, and pay by ${longDay(d.due)}` : ""}. We ${d.delivery === "pickup" ? "hand over" : "ship"} your BitchBoy once it's in; this page then says “Paid”.</p>
      <a href="${invoiceUrl()}" target="_blank" rel="noopener"><button type="button" class="pay">Your invoice ${esc(d.invoice_no || "")} (PDF)</button></a>`;
}
function cashBox(d) {
  return `
      <h2 style="margin-top:6px">Pay in cash at the pickup</h2>
      <p class="small">You pay <b>${eur(d.total_cents)}</b> in cash when you pick up your BitchBoy in Amsterdam. We agree the time and place with you on Instagram.</p>
      <a href="${invoiceUrl()}" target="_blank" rel="noopener"><button type="button" class="pay">Your invoice ${esc(d.invoice_no || "")} (PDF)</button></a>`;
}

async function pay() {
  const btn = document.getElementById("pay"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Opening Stripe…"; err.textContent = "";
  try {
    const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ t: token, action: "pay" }) });
    const d = await r.json();
    if (d.url) { location.href = d.url; return; }
    if (d.state && d.state !== "approved") return show(d);
    err.textContent = d.error || "Something went wrong. Please try again.";
  } catch { err.textContent = "No connection. Check your internet and try again."; }
  btn.disabled = false; btn.textContent = "Pay";
}

if (!token) message("bad", ...DEAD.invalid);
else if (params.get("paid")) { view.innerHTML = '<p class="small">Checking your payment…</p>'; setTimeout(load, 1500); }
else load();
</script>
</body>
</html>
